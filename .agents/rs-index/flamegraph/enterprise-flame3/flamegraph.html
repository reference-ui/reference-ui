<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Flamegraph — enterprise-flame3 (Rust / reference-rs)</title>
<style>
:root{
  --bg:#faf8f4; --panel:#fff; --ink:#241f1a; --muted:#6f655c; --line:#e5ded2;
  --accent:#c2410c; --accent-soft:#fdeede; --sel:#1d4ed8;
  --row-h:19px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{padding:14px 20px 10px;border-bottom:1px solid var(--line);background:linear-gradient(#fff,#faf8f4)}
header h1{margin:0;font-size:17px;font-weight:650}
header h1 .sub{font-weight:400;color:var(--muted);font-size:12px}
header .meta{color:var(--muted);font-size:12px;margin-top:2px}
header .meta code{background:#f1ece1;padding:0 5px;border-radius:4px;font-size:11px}
#toolbar{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:8px 20px;background:rgba(250,248,244,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(4px)}
#toolbar input[type=search]{width:260px;padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff}
#toolbar select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff}
#toolbar button{padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font-size:12px}
#toolbar button:hover{background:#f1ece1}
#toolbar .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#toolbar .seg button{border:0;border-radius:0;padding:5px 10px}
#toolbar .seg button.on{background:var(--ink);color:#fff}
#crumbs{font-size:11px;color:var(--muted);flex-basis:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#crumbs b{color:var(--accent);cursor:pointer;font-weight:600}
#crumbs b:hover{text-decoration:underline}
#layout{display:flex;gap:0;align-items:flex-start}
#main{flex:1;min-width:0;padding:12px 0 60px 20px}
#flame{position:relative;font-size:11px;line-height:var(--row-h);user-select:none}
.frow{position:absolute;height:var(--row-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:1px solid rgba(0,0,0,.18);border-radius:2px;padding:0 4px;cursor:pointer;color:#2b2118}
.frow:hover{filter:brightness(1.08);border-color:rgba(0,0,0,.45)}
.frow.dim{opacity:.18}
.frow.match{outline:2px solid var(--sel);outline-offset:-2px;opacity:1}
.frow.selfhot{box-shadow:inset 0 -3px 0 rgba(194,65,12,.55)}
#tip{position:fixed;z-index:50;pointer-events:none;display:none;max-width:460px;background:#1f1b16;color:#f5efe4;
  padding:8px 10px;border-radius:7px;font-size:11.5px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
#tip .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all;color:#ffd9a8}
#tip .m{color:#b9ae9e;margin-top:3px}
#tip .m b{color:#fff}
aside{width:392px;flex:none;position:sticky;top:52px;max-height:calc(100vh - 52px);overflow:auto;
  border-left:1px solid var(--line);background:var(--panel);padding:12px 14px 40px}
.card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:12px;background:#fff}
.card h2{margin:0 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.card h2 .run{float:right;text-transform:none;letter-spacing:0;font-weight:400}
table.mini{width:100%;border-collapse:collapse;font-size:11.5px}
table.mini td,table.mini th{padding:2px 4px;text-align:right;font-variant-numeric:tabular-nums}
table.mini td:first-child,table.mini th:first-child{text-align:left}
table.mini tr+tr td{border-top:1px solid #f0e9da}
.libbar{display:flex;align-items:center;gap:7px;font-size:11px;margin:3px 0}
.libbar .dot{width:9px;height:9px;border-radius:2px;flex:none}
.libbar .nm{width:172px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libbar .bar{flex:1;height:9px;background:#f1ece1;border-radius:4px;overflow:hidden}
.libbar .bar i{display:block;height:100%}
.libbar .pc{width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{flex:1;border:1px solid var(--line);background:#f7f3ea;border-radius:6px;padding:4px 2px;font-size:11px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hrow{display:flex;gap:6px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #f3eee2;
  padding:4px 2px;cursor:pointer;font-size:11px}
.hrow:hover{background:var(--accent-soft)}
.hrow.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.hrow .rk{color:var(--muted);width:18px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.hrow .nm{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .st{flex:none;font-variant-numeric:tabular-nums;color:var(--muted)}
.hrow .st b{color:var(--ink)}
#doc{display:none}
#doc.show{display:block;border-color:var(--accent)}
#doc .fn{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:600;word-break:break-all}
#doc .stats{display:flex;gap:12px;margin:7px 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#doc .stats b{color:var(--ink);font-size:13px}
#doc p{margin:6px 0;font-size:12px}
#doc .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:9px 0 1px}
#doc .src{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--muted);word-break:break-all}
#doc .libtag{display:inline-block;font-size:10px;background:#f1ece1;border-radius:4px;padding:1px 7px;margin-left:6px;vertical-align:1px}
footer{padding:14px 20px 30px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line)}
footer code{background:#f1ece1;padding:0 5px;border-radius:4px;font-size:11px}
footer a{color:var(--accent)}
.hint{font-size:11px;color:var(--muted);margin:0 0 8px}
kbd{background:#f1ece1;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10.5px;font-family:inherit}
</style>
</head>

</div>

  const rows=m.buckets.map(b=>`<tr><td>${b.name}</td><td>${b.ms==null?'—':b.ms.toFixed(1)+' ms'}</td><td>${b.weight} wt</td><td style="text-align:left;color:var(--muted)">${esc(shortLib(b.topLib))}</td></tr>`).join('');
  $('#run').innerHTML=`<table class="mini"><tr><th>phase</th><th>wall</th><th>flame</th><th style="text-align:left">top lib</th></tr>${rows}</table>`+
   `<div style="font-size:10.5px;color:var(--muted);margin-top:5px">RECONCILED — phase sums match to 0.000 ms. `+
   `Weight ≈ ms at 1000 Hz. startup sits outside sync; worker total ${m.phases.workerTotal.toFixed(1)} ms, `+
   `sync ${m.syncMs.toFixed(1)} ms, RSS peak ${(m.rssPeak/1048576).toFixed(0)} MiB.</div>`;
  // phase select
  const pw={};for(const s of DATA.samples)pw[s.p]=(pw[s.p]||0)+s.w;
  const order=['all','startup','config','scan','evaluate','compile','publish','syncResidual','workerTail','preMain','postWorker'];
  $('#phase').innerHTML=order.filter(p=>p==='all'||pw[p]).map(p=>
    p==='all'?`<option value="all">All phases (${DATA.meta.weightSum} wt)</option>`:`<option value="${p}">${p} (${pw[p]} wt)</option>`).join('');
  $('#foot').innerHTML=`Evidence: <code>docs/evidence/flamegraph/enterprise-flame3/{profile.json.gz, summary.md, meta.json, phases.json, callers.md}</code> · `+
   `Recon: <code>docs/missions/completed/operation-flamegraph-recon-v2.md</code> · Query: `+
   `<code>pnpm agentrs flame --top|--modules|--inspect &lt;bundle&gt;</code> · Re-record: `+
   `<code>pnpm agentrs flame -- enterprise</code> · View raw: <code>samply load profile.json.gz</code> · `+
   `Sampling noise: 1 wt ≈ 0.07% — lib shares robust, few-weight frames are not.`;
}
/* ============ events ============ */
$('#q').addEventListener('input',ev=>{state.q=ev.target.value;render();});
$('#colorseg').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  $('#colorseg').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  state.color=b.dataset.c;render();
}));
$('#phase').addEventListener('change',ev=>{state.phase=ev.target.value;state.focus=null;rebuild();render();});
$('#reset').addEventListener('click',()=>{state.focus=null;state.sel=null;state.q='';$('#q').value='';render();});
$('#hottabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
  $('#hottabs').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  state.hotTab=b.dataset.t;renderHot();
}));
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){state.focus=null;render();}});
flame.addEventListener('click',()=>{if(state.focus){/* background click keeps zoom */}});
document.addEventListener('click',ev=>{
  const t=ev.target.closest('.frow');if(t)return;
  // clicking empty flame area zooms out one level
  if(ev.target.closest('#flame')&&state.focus){state.focus=(state.focus.parent&&state.focus.parent.fi!==-1)?state.focus.parent:null;render();}
});
// flame frame click also selects for docs (alt: plain click zooms; shift+click selects)
flame.addEventListener('click',ev=>{
  const row=ev.target.closest('.frow');if(!row)return;
  // selection follows zoom target: find node by title? use last hovered via tip is fragile; instead select on double-click
});
flame.addEventListener('dblclick',ev=>{
  const row=ev.target.closest('.frow');if(!row)return;
  const name=row.textContent;
  const cand=FUNCS.filter(f=>f.name===name).sort((a,b)=>b.incl-a.incl)[0];
  if(cand){state.sel={name:cand.name,lib:cand.lib};renderDoc();render();}
});
/* ============ go ============ */
initChrome();rebuild();render();
// Classic orientation puts the root at the bottom: land there so the
// big picture (wide frames) is visible first; leaves are upward.
requestAnimationFrame(()=>{
  const y=flame.offsetTop+flame.offsetHeight-innerHeight+140;
  if(y>0)window.scrollTo(0,y);
});
</script>
</body>
