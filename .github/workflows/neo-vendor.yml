name: Neo Vendor

on:
  push:
    paths:
      - packages/reference-rs/modules/primitives/**
      - packages/reference-neo/tools/vendor-rust-primitives.mjs
      - packages/reference-neo/src/native/generated/primitives/**
      - .github/workflows/neo-vendor.yml
  pull_request:
    paths:
      - packages/reference-rs/modules/primitives/**
      - packages/reference-neo/tools/vendor-rust-primitives.mjs
      - packages/reference-neo/src/native/generated/primitives/**
      - .github/workflows/neo-vendor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check vendored primitives are fresh
        working-directory: packages/reference-neo
        run: node tools/vendor-rust-primitives.mjs --check
