name: Consumer Smoke

# W-31: pack dist, mount every component in a bare Vite app, zero console
# errors; dist freshness enforced on the same gate (B-11).
on:
  push:
    paths:
      - packages/reference-lib/src/**
      - packages/reference-lib/scripts/**
      - packages/reference-lib/package.json
      - packages/reference-lib/tsup.config.ts
      - packages/reference-lib/ui.config.ts
      - .github/workflows/consumer-smoke.yml
  pull_request:
    paths:
      - packages/reference-lib/src/**
      - packages/reference-lib/scripts/**
      - packages/reference-lib/package.json
      - packages/reference-lib/tsup.config.ts
      - packages/reference-lib/ui.config.ts
      - .github/workflows/consumer-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            packages/reference-rs/dist/cargo/
          key: ${{ runner.os }}-x86_64-unknown-linux-gnu-cargo-${{ hashFiles('packages/reference-rs/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: pnpm --filter @reference-ui/rust run ensure-native

      - name: Install Playwright chromium
        run: pnpm --dir packages/reference-lib exec playwright install --with-deps chromium

      - name: Build @reference-ui/lib
        run: pnpm --dir packages/reference-lib run build

      - name: Consumer smoke gate
        run: node packages/reference-lib/scripts/consumer-smoke/run.mjs
