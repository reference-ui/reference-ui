name: Rust Compile

on:
  workflow_call:
    inputs:
      matrix_json:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      artifact_prefix:
        required: false
        type: string
        default: bindings
  workflow_dispatch:
    inputs:
      matrix_json:
        description: JSON matrix entries with runner/target
        required: true
        type: string
        default: '[{"runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}]'
      ref:
        description: Git ref or SHA to check out
        required: false
        type: string
        default: ""
      artifact_prefix:
        description: Artifact name prefix
        required: false
        type: string
        default: bindings

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.matrix_json) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            packages/reference-rs/dist/cargo/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('packages/reference-rs/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile native binary
        run: pnpm --filter @reference-ui/rust exec napi build --package reference-native --platform --release --target ${{ matrix.target }} --output-dir dist/native --no-js

      - name: Stamp native binary with its inputs hash
        # The stamp records the hash of the Rust sources this binary was compiled from.
        # The pipeline refuses a binary without a matching stamp, so CI must write one.
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          case "$RUST_TARGET" in
            x86_64-unknown-linux-gnu) triple=linux-x64-gnu ;;
            x86_64-apple-darwin) triple=darwin-x64 ;;
            aarch64-apple-darwin) triple=darwin-arm64 ;;
            x86_64-pc-windows-msvc) triple=win32-x64-msvc ;;
            *)
              echo "No reference-native triple for Rust target $RUST_TARGET" >&2
              exit 1
              ;;
          esac
          pnpm --dir packages/reference-rs run write-native-stamp -- "$triple"

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.target }}
          # Binary and stamp travel together; consumers keep them side by side.
          path: |
            packages/reference-rs/dist/native/reference-native.*.node
            packages/reference-rs/dist/native/reference-native.*.inputs.sha256
          if-no-files-found: error
