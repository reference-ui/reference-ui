<!doctype html>
<!-- GLOBAL-10 world. It links the synced stylesheet and stages three field bezels. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href=".reference-ui/styled/styles.css" />
  </head>
  <body>
    <div data-reference-field id="valid-bezel">
      <input type="text" id="valid-input" aria-invalid="false" value="ok" />
    </div>
    <div data-reference-field id="invalid-bezel">
      <input type="text" id="invalid-input" aria-invalid="true" value="bad" />
    </div>
    <div data-reference-field data-invalid id="twin-bezel">
      <input type="text" id="twin-input" value="twin" />
    </div>
  </body>
</html>
