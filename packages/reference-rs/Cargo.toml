[workspace]
members = [
  "modules/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
oxc_parser = "0.115"
oxc_ast = "0.115"
oxc_ast_visit = "0.115"
oxc_span = "0.115"
oxc_allocator = "0.115"
oxc_traverse = "0.115"
oxc_semantic = "0.115"
oxc_diagnostics = "0.115"
regex = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
globwalk = "0.9.1"
ts-rs = "12.0.1"
indexmap = "2.2.6"
dashmap = "6.0.1"
chrono = { version = "0.4", features = ["serde"] }
proptest = "1"
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
napi-build = "2"

# internal
shared = { path = "modules/shared" }
atlas = { path = "modules/atlas" }
tasty = { path = "modules/tasty" }
styletrace = { path = "modules/styletrace" }
canon = { path = "modules/canon" }
base_system = { path = "modules/base-system" }
atomic = { path = "modules/atomic" }
typegen = { path = "modules/typegen" }
virtualrs = { path = "modules/virtualrs" }
module_graph = { path = "modules/module-graph" }
