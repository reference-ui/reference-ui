[package]
name = "atomic"
version.workspace = true
edition.workspace = true
publish = false
description = "Native atomic CSS compiler for Reference UI"

[dependencies]
canon.workspace = true
base_system.workspace = true
module_graph.workspace = true
styletrace.workspace = true
serde = { workspace = true }
# Pinned explicitly: per-prop object declaration order follows author order
# only with `preserve_order` (see the reverse-alpha test in runtime/tests.rs).
serde_json = { workspace = true, features = ["preserve_order"] }
smallvec = { version = "1", features = ["serde"] }
rustc-hash = "2"
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_span = { workspace = true }
oxc_allocator = { workspace = true }
oxc_syntax = "0.115"
indexmap = { workspace = true, features = ["serde"] }

[dev-dependencies]
shared.workspace = true
typegen.workspace = true
