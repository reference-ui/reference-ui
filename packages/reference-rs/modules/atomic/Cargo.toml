[package]
name = "atomic"
version.workspace = true
edition.workspace = true
publish = false
description = "Native atomic CSS compiler for Reference UI"

[features]
# Instrument build for `pnpm agentrs alloc`: counting global allocator plus
# per-compile span and per-phase dumps. Enabled only through the runtime
# `alloc-trace` feature; never enabled in the shipped `.node`.
alloc-trace = []

[dependencies]
canon.workspace = true
base_system.workspace = true
module_graph.workspace = true
styletrace.workspace = true
serde = { workspace = true }
# Pinned explicitly: per-prop object declaration order follows author order
# only with `preserve_order` (see the reverse-alpha test in runtime/tests.rs).
serde_json = { workspace = true, features = ["preserve_order"] }
smallvec = { version = "1", features = ["serde"] }
rustc-hash = "2"
oxc_parser = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_span = { workspace = true }
oxc_allocator = { workspace = true }
oxc_diagnostics = { workspace = true }
oxc_syntax = "0.115"
indexmap = { workspace = true, features = ["serde"] }

[dev-dependencies]
shared.workspace = true
typegen.workspace = true
criterion.workspace = true

[[bench]]
name = "resolve"
harness = false
test = true

[[bench]]
name = "plan_build"
harness = false
test = true

[[bench]]
name = "census"
harness = false
test = true

[[bench]]
name = "line_index"
harness = false
test = true
