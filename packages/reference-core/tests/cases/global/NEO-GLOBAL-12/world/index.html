<!doctype html>
<!-- GLOBAL-12 world. It links the synced stylesheet and stages mix twins plus hex references. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href=".reference-ui/styled/styles.css" />

    <button type="button" class="ref-button" id="hovered" data-hover>hot</button>

      h

      id="press-ref"

    >
      p
    </div>
